service: linear-regression-inference

frameworkVersion: '3'

provider:
  name: aws
  ecr:
    # In this section you can define images that will be built locally and uploaded to ECR
    images:
      appimage:
        path: ./
        platform: linux/amd64

  # you can overwrite defaults here
  stage: dev
  region: us-east-1
  timeout: 30

  environment:
    MODEL_BUCKET_NAME: ${self:custom.modelBucketName}
    MODEL_OBJECT_KEY: ${self:custom.modelObjectKey}

# you can add statements to the Lambda function's IAM Role here
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "s3:GetObject"
          Resource: "arn:aws:s3:::inference-${self:custom.modelBucketName}/${self:custom.modelObjectKey}"

custom:
  modelBucketName: inference-${sls:stage}-linear-regression-models-898059392798
  modelObjectKey: mlr_mpg_v1.joblib

functions:
  predict:
    image:
      name: appimage
    architecture: x86_64
    events:
      - httpApi:
          path: /predict
          method: post
          authorizer: 
            type: aws_iam

resources:
  Resources:
    LinearRegressionBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.modelBucketName}
        VersioningConfiguration:
          Status: Enabled

