[project]
name = "week02-energy-efficiency"
version = "0.1.0"
description = "Week 02 — Multiple Linear Regression on the UCI Energy
Efficiency dataset"
requires-python = ">=3.10"
dependencies = [
  "pandas (>=3.0.5,<4.0.0)",
  "numpy (>=2.5.2,<3.0.0)",
  "matplotlib (>=3.11.1,<4.0.0)",
  "seaborn (>=0.13.2,<0.14.0)",
  "scikit-learn (>=1.9.0,<2.0.0)",
  "ucimlrepo",
  "openpyxl",  # to read the .xlsx file
  "jupyter",
  "scipy (>=1.18.0,<2.0.0)",
  "statsmodels (>=0.14.6,<0.15.0)",
  "fastapi (>=0.117.1,<0.118.0)",
  "uvicorn (>=0.36.0,<0.37.0)",
  "joblib (>=1.5.2,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.6.3"
ipykernel = "7.3.0"
